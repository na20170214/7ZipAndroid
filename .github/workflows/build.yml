name: Build 7zr Android
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch official 7‑Zip 23.01 source
        run: |
          wget https://www.7-zip.org/a/7z2301-src.tar.xz
          tar -xf 7z2301-src.tar.xz

      - name: Download Android NDK r17b
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r17b-linux-x86_64.zip
          unzip -q android-ndk-r17b-linux-x86_64.zip
          echo "NDK_ROOT=$PWD/android-ndk-r17b" >> $GITHUB_ENV
          echo "PATH=$PWD/android-ndk-r17b/build:$PATH" >> $GITHUB_ENV

      - name: Prepare jni dir & generate makefiles
        run: |
          cd CPP/Android/7zr
          mkdir -p jni
          cat > jni/Application.mk <<'EOF'
APP_ABI := arm64-v8a
APP_PLATFORM := android-24
APP_STL := none
EOF

          cat > jni/Android.mk <<'EOF'
LOCAL_PATH:= $(call my-dir)
include $(CLEAR_VARS)

7Z_BASE := ../../..

LOCAL_C_INCLUDES := \
$(7Z_BASE)/CPP \
$(7Z_BASE)/CPP/Include

LOCAL_SRC_FILES := \
$(7Z_BASE)/CPP/7zr/Main.cpp \
$(7Z_BASE)/CPP/7z/7zAlloc.c \
$(7Z_BASE)/CPP/7z/7zBuf.c \
$(7Z_BASE)/CPP/7z/7zBuf2.c \
$(7Z_BASE)/CPP/7z/7zDec.c \
$(7Z_BASE)/CPP/7z/7zFile.c \
$(7Z_BASE)/CPP/7z/7zIn.c \
$(7Z_BASE)/CPP/7z/7zMain.c \
$(7Z_BASE)/CPP/7z/7zOpen.c \
$(7Z_BASE)/CPP/7z/7zRead.c \
$(7Z_BASE)/CPP/7z/7zUtil.c \
$(7Z_BASE)/CPP/Common/MyString.cpp \
$(7Z_BASE)/CPP/Common/MyVector.cpp \
$(7Z_BASE)/CPP/Common/MyWindows.cpp \
$(7Z_BASE)/CPP/Windows/FileIO.cpp \
$(7Z_BASE)/CPP/Windows/FileFind.cpp \
$(7Z_BASE)/CPP/Windows/FileName.cpp

LOCAL_MODULE := 7zr
LOCAL_CFLAGS += -DENV_UNIX -D_REENTRANT -O2
include $(BUILD_EXECUTABLE)
EOF

      - name: Run ndk‑build compile 7zr
        run: |
          cd CPP/Android/7zr/jni
          ndk-build

      - name: Upload compiled binary
        uses: actions/upload-artifact@v4
        with:
          name: 7zr-arm64-v8a
          path: CPP/Android/7zr/libs/arm64-v8a/7zr